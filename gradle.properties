# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE are ignored when building from the
# command line, check Android Studio help for more details.
# (When you open your project in Android Studio, it imports the Gradle settings
# you specify here.)
#
# **** DO NOT MODIFY THIS FILE ****
#

# For more details on how to configure your build environment visit
http://www.gradle.org/guide/gradle_and_the_build_environment

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings and disabling specific optional features.
# (Source: https://docs.gradle.org/current/userguide/build_environment.html#configuring_jvm_memory)
org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
http://www.gradle.org/guide/gradle_parallel_builds
org.gradle.parallel=true

# AndroidX package structure to make it clear which packages are being used
android.useAndroidX=true
android.enableJetifier=true

# Enable gradle to use offline mode
org.gradle.offline=false
